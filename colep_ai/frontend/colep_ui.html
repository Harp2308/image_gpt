<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colep AI — SOP Assistant</title>
<style>
:root {
  --header-bg: #e8e4f8;
  --header-border: #d4cff0;
  --sidebar-bg: #edeaf8;
  --sidebar-border: #d4cff0;
  --answer-bg: #ffffff;
  --page-bg: #f5f4f0;
  --card-bg: #fafafa;
  --card-border: #ede8f5;
  --text-primary: #2d2a4a;
  --text-secondary: #6b68a0;
  --text-muted: #9b96c8;
  --text-dim: #b0accc;
  --accent: #5b4fcf;
  --accent-bg: #ede8f5;
  --accent-light: #d4cff0;
  --chip-bg: #fde8c8;
  --chip-text: #b87333;
  --section-color: #9b84d4;
  --green: #4a9e6e;
  --red: #c0392b;
  --input-bg: #ffffff;
  --input-border: #d4cff0;
  --btn-bg: #5b4fcf;
  --btn-text: #ffffff;
  --toggle-bg: #d4cff0;
  --toggle-knob: #5b4fcf;
  --mono: 'JetBrains Mono','Fira Code','Consolas',monospace;
  --sans: 'Inter',system-ui,sans-serif;
  --sidebar-width: 248px;
  --header-h: 48px;
  --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --header-bg: #1a1730;
  --header-border: #2a2645;
  --sidebar-bg: #141220;
  --sidebar-border: #2a2645;
  --answer-bg: #0f0e1a;
  --page-bg: #0a0918;
  --card-bg: #16141f;
  --card-border: #2a2645;
  --text-primary: #e4e0f8;
  --text-secondary: #9b96c8;
  --text-muted: #6b6890;
  --text-dim: #4a4770;
  --accent: #8b7ff0;
  --accent-bg: #1e1a38;
  --accent-light: #2e2a50;
  --chip-bg: #2e2010;
  --chip-text: #f0a855;
  --section-color: #9b84d4;
  --green: #3dd68c;
  --red: #ff6b6b;
  --input-bg: #1a1730;
  --input-border: #2a2645;
  --btn-bg: #7b6fe0;
  --btn-text: #ffffff;
  --toggle-bg: #2a2645;
  --toggle-knob: #8b7ff0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page-bg);color:var(--text-primary);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background var(--transition),color var(--transition)}

/* HEADER */
header{
  height:var(--header-h);
  background:var(--header-bg);
  border-bottom:1px solid var(--header-border);
  display:flex;align-items:center;gap:10px;
  padding:0 16px;
  flex-shrink:0;
  transition:background var(--transition),border-color var(--transition);
}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.h-pill{font-size:10px;color:var(--text-muted);background:var(--accent-light);padding:3px 10px;border-radius:20px;font-family:var(--mono)}
.h-pill.dev{background:var(--chip-bg);color:var(--chip-text)}
.h-spacer{flex:1}
.h-hint{font-family:var(--mono);font-size:9px;color:var(--text-dim)}

/* THEME TOGGLE */
.theme-toggle{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--toggle-bg);border-radius:20px;padding:4px 10px;
  border:none;transition:background var(--transition);
}
.theme-toggle span{font-size:12px}
.theme-toggle .t-label{font-family:var(--mono);font-size:9px;color:var(--text-muted)}

/* SIDEBAR TOGGLE */
.sidebar-toggle{
  width:32px;height:32px;border-radius:8px;border:none;
  background:var(--accent-light);color:var(--accent);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  transition:background var(--transition),color var(--transition);
}
.sidebar-toggle:hover{background:var(--accent-bg)}

/* LAYOUT */
.layout{
  flex:1;display:flex;min-height:0;
  transition:background var(--transition);
}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-width);
  flex-shrink:0;
  background:var(--sidebar-bg);
  border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:width var(--transition),background var(--transition),border-color var(--transition);
}
.sidebar.collapsed{width:0;border-right:none}

.sidebar-inner{
  width:var(--sidebar-width);
  min-width:var(--sidebar-width);
  display:flex;flex-direction:column;
  height:100%;
  overflow:hidden;
}

.s-section{padding:16px 16px 12px;border-bottom:1px solid var(--sidebar-border)}
.field-label{
  font-family:var(--mono);font-size:9px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--text-dim);margin-bottom:8px;
}
textarea{
  width:100%;background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:8px;color:var(--text-primary);font-family:var(--sans);
  font-size:12px;line-height:1.6;padding:10px;resize:none;height:76px;
  outline:none;transition:border-color .15s,background var(--transition);
}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--text-dim)}
.controls-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.topk-label{font-family:var(--mono);font-size:9px;color:var(--text-dim)}
input[type=number]{
  background:var(--input-bg);border:1px solid var(--input-border);border-radius:6px;
  color:var(--text-primary);font-family:var(--mono);font-size:12px;
  padding:6px 8px;width:50px;outline:none;text-align:center;
  transition:background var(--transition),border-color var(--transition);
}
.run-btn{
  flex:1;background:var(--btn-bg);border:none;border-radius:8px;
  color:var(--btn-text);cursor:pointer;font-family:var(--mono);font-size:10px;
  font-weight:700;letter-spacing:.08em;padding:8px;text-transform:uppercase;
  transition:opacity .15s,background var(--transition);
}
.run-btn:hover{opacity:.88}
.run-btn:disabled{opacity:.4;cursor:not-allowed}
.status-line{margin-top:8px;font-family:var(--mono);font-size:9px;color:var(--text-dim);min-height:13px}
.status-line.ok{color:var(--green)}
.status-line.error{color:var(--red)}

.s-docs{flex:1;overflow-y:auto;padding:12px 16px}
.doc-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;border:1px solid transparent;
  margin-bottom:4px;cursor:default;
  transition:background .12s,border-color .12s;
}
.doc-row:hover{background:var(--answer-bg);border-color:var(--card-border)}
.doc-icon{
  width:24px;height:24px;border-radius:5px;background:var(--accent-bg);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;flex-shrink:0;
}
.doc-name{font-size:11px;color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MAIN ANSWER */
.main{
  flex:1;background:var(--answer-bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:background var(--transition);
}
.answer-scroll{flex:1;overflow-y:auto;padding:28px 36px}
.answer-wrap{max-width:720px}

.answer-title-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;padding-bottom:14px;
  border-bottom:1px solid var(--card-border);
}
.answer-title{font-size:18px;font-weight:700;color:var(--text-primary)}
.lang-chip{
  font-family:var(--mono);font-size:9px;font-weight:700;
  background:var(--chip-bg);color:var(--chip-text);
  padding:4px 10px;border-radius:20px;letter-spacing:.06em;
}
.intro-text{font-size:13px;line-height:1.7;color:var(--text-secondary);margin-bottom:18px}

.section-head{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.16em;color:var(--section-color);
  margin:22px 0 10px;
}
.section-head::after{content:'';flex:1;height:1px;background:var(--card-border)}

/* STEP CARD */
.step-card{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px 14px;background:var(--card-bg);
  border:1px solid var(--card-border);border-radius:10px;
  margin-bottom:6px;
  transition:border-color .15s,background var(--transition);
}
.step-card:hover{border-color:var(--accent-light)}
.step-num{
  font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--accent);background:var(--accent-bg);
  border:1px solid var(--accent-light);border-radius:6px;
  padding:3px 7px;flex-shrink:0;margin-top:1px;
}
.step-body{flex:1;min-width:0}
.step-text{font-size:13px;line-height:1.65;color:var(--text-primary)}
.step-text strong{font-weight:600;color:var(--text-primary)}

/* large image block below step text */
.step-img-block{margin-top:10px;cursor:pointer;display:inline-block;border:1px solid var(--card-border);border-radius:8px;overflow:hidden;transition:border-color .15s}
.step-img-block:hover{border-color:var(--accent)}
.step-img-block img{display:block;max-width:480px;max-height:280px;object-fit:contain;background:var(--accent-bg)}



.prose-p{font-size:13px;line-height:1.7;color:var(--text-secondary);margin-bottom:10px}
.empty-state{color:var(--text-dim);font-size:13px;text-align:center;padding:80px 20px;line-height:2}

/* MODAL */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  z-index:200;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--answer-bg);border:1px solid var(--card-border);
  border-radius:14px;max-width:86vw;max-height:86vh;
  overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.18);
}
.modal-box img{max-width:74vw;max-height:66vh;object-fit:contain;border-radius:8px;display:block}
.modal-footer{display:flex;align-items:center;gap:14px}
.modal-marker{font-family:var(--mono);font-size:10px;color:var(--chip-text);background:var(--chip-bg);padding:3px 10px;border-radius:10px}
.modal-desc{font-size:12px;color:var(--text-muted);line-height:1.55;flex:1}
.modal-close{
  background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-light);
  font-size:11px;font-family:var(--mono);font-weight:700;
  padding:6px 16px;border-radius:8px;cursor:pointer;flex-shrink:0;
  transition:background .12s;
}
.modal-close:hover{background:var(--accent-light)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent-light);border-radius:2px}
</style>
</head>
<body>

<header>
  <span class="logo">Colep AI</span>
  <span class="h-pill">SOP Assistant</span>
  <span class="h-pill dev">dev</span>
  <span class="h-spacer"></span>
  <span class="h-hint">Ctrl+Enter to run</span>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
    <span id="themeIcon">🌙</span>
    <span class="t-label" id="themeLabel">Dark</span>
  </button>
  <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar" id="sidebarToggleBtn">☰</button>
</header>

<div class="layout">

  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <div class="s-section">
        <div class="field-label">Query</div>
        <textarea id="queryInput" placeholder="Como ligar a linha? / How do I turn on the line?"></textarea>
        <div class="controls-row">
          <span class="topk-label">top_k</span>
          <input type="number" id="topK" value="5" min="1" max="20">
          <button class="run-btn" id="sendBtn" onclick="runQuery()">Run Query</button>
        </div>
        <div class="status-line" id="status"></div>
      </div>

      <div class="field-label" style="padding:12px 16px 4px">Source Documents</div>
      <div class="s-docs" id="docList"></div>

    </div>
  </div>

  <div class="main">
    <div class="answer-scroll">
      <div class="answer-wrap" id="answerWrap">
        <div class="empty-state">Run a query to see the answer here.</div>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay" onclick="handleModalClick(event)">
  <div class="modal-box">
    <img id="modalImg" src="" alt="">
    <div class="modal-footer">
      <span class="modal-marker" id="modalMarker"></span>
      <span class="modal-desc" id="modalDesc"></span>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "";
let citationMap = {};
let sidebarOpen = true;
let darkMode = false;

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById("sidebar").classList.toggle("collapsed", !sidebarOpen);
  document.getElementById("sidebarToggleBtn").textContent = sidebarOpen ? "☰" : "›";
}

function toggleTheme() {
  darkMode = !darkMode;
  document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  document.getElementById("themeIcon").textContent = darkMode ? "☀️" : "🌙";
  document.getElementById("themeLabel").textContent = darkMode ? "Light" : "Dark";
}

function ea(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function setStatus(cls, msg) {
  const el = document.getElementById("status");
  el.className = "status-line" + (cls ? " "+cls : "");
  el.textContent = msg;
}

async function runQuery() {
  const query = document.getElementById("queryInput").value.trim();
  if (!query) return;
  const topK = parseInt(document.getElementById("topK").value) || 5;
  document.getElementById("sendBtn").disabled = true;
  setStatus("", "Fetching…");
  document.getElementById("answerWrap").innerHTML = '<div class="empty-state">Loading…</div>';
  document.getElementById("docList").innerHTML = '';
  try {
    const resp = await fetch(`${API_BASE}/query`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query, top_k:topK})
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    citationMap = {};
    (data.citations||[]).forEach(c => { citationMap[c.marker] = c; });
    renderAnswer(data.answer, data.citations||[]);
    renderDocList(data.citations||[]);
    setStatus("ok", `${(data.citations||[]).length} citations | ${data.language||"?"}`);
  } catch(e) {
    setStatus("error", `Error: ${e.message}`);
    document.getElementById("answerWrap").innerHTML = '<div class="empty-state">Request failed.</div>';
  } finally {
    document.getElementById("sendBtn").disabled = false;
  }
}

function renderAnswer(text, citations) {
  const wrap = document.getElementById("answerWrap");
  wrap.innerHTML = "";

  const titleMatch = text.match(/^#\s+(.+)$/m);
  const title = titleMatch ? titleMatch[1] : "Answer";

  const titleRow = document.createElement("div");
  titleRow.className = "answer-title-row";
  titleRow.innerHTML = `<div class="answer-title">${ea(title)}</div><span class="lang-chip">${ea(detectLang(text))}</span>`;
  wrap.appendChild(titleRow);

  const body = text.replace(/^#\s+.+$/m,"").trim();
  const lines = body.split("\n");

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line || line === "---") continue;

    if (line.startsWith("## ")) {
      const sh = document.createElement("div");
      sh.className = "section-head";
      sh.textContent = line.slice(3);
      wrap.appendChild(sh);
      continue;
    }

    const stepMatch = line.match(/^(\d+)\.\s+([\s\S]+)$/);
    if (stepMatch) {
      wrap.appendChild(buildStepCard(stepMatch[1], stepMatch[2]));
      continue;
    }

    const p = document.createElement("p");
    p.className = "prose-p";
    p.innerHTML = fmtInline(line);
    wrap.appendChild(p);
  }
}

function buildStepCard(num, rawText) {
  const markerRe = /🖼️\[page\s+(\d+)\s*\|\s*entry\s+([\w-]+)\]/g;
  const refs = [];
  let m;
  while ((m = markerRe.exec(rawText)) !== null) {
    refs.push({ key: `[page ${m[1]} | entry ${m[2]}]`, pg: m[1], eid: m[2] });
  }

  const cleanText = rawText.replace(/🖼️\[page\s+(\d+)\s*\|\s*entry\s+([\w-]+)\]/g, "");

  const card = document.createElement("div");
  card.className = "step-card";

  let imgHtml = "";
  for (const ref of refs) {
    const c = citationMap[ref.key];
    if (c && c.image_url) {
      const url = ea(`${API_BASE}${c.image_url}`);
      imgHtml += `<div class="step-img-block" onclick="openModal('${ea(ref.key)}')"><img src="${url}" alt="${ea(ref.key)}" loading="lazy"></div>`;
    }
  }

  card.innerHTML = `
    <span class="step-num">${num}</span>
    <div class="step-body">
      <div class="step-text">${fmtInline(cleanText)}</div>
      ${imgHtml}
    </div>`;
  return card;
}

function renderDocList(citations) {
  const list = document.getElementById("docList");
  const seen = new Set();
  citations.forEach(c => { if (c.source_file) seen.add(c.source_file); });
  if (!seen.size) { list.innerHTML = ''; return; }
  list.innerHTML = [...seen].map(name => `
    <div class="doc-row">
      <div class="doc-icon">📄</div>
      <span class="doc-name">${ea(name)}</span>
    </div>`).join('');
}

function fmtInline(s) {
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function detectLang(text) {
  return /\b(para|como|processo|linha|passo|deve|ajustar|limpar|retirar)\b/i.test(text) ? "PT" : "EN";
}

function openModal(key) {
  const c = citationMap[key];
  if (!c || !c.image_url) return;
  document.getElementById("modalImg").src = `${API_BASE}${c.image_url}`;
  document.getElementById("modalMarker").textContent = c.marker || key;
  document.getElementById("modalDesc").textContent = c.image_description || "";
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function handleModalClick(e) {
  if (e.target === document.getElementById("modalOverlay")) closeModal();
}

document.getElementById("queryInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) runQuery();
});


</script>
</body>
</html>
