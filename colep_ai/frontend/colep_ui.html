<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colep AI — SOP Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <span class="logo">Colep AI</span>
  <span class="h-pill">SOP Assistant</span>
  <span class="h-pill dev">dev</span>
  <span class="h-spacer"></span>
  <span class="h-hint">Ctrl+Enter to run</span>
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
    <span id="themeIcon">🌙</span>
    <span class="t-label" id="themeLabel">Dark</span>
  </button>
  <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar" id="sidebarToggleBtn">☰</button>
</header>

<div class="layout">

  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <div class="s-section">
        <div class="field-label">Query</div>
        <textarea id="queryInput" placeholder="Como ligar a linha? / How do I turn on the line?"></textarea>
        <div class="controls-row">
          <span class="topk-label">top_k</span>
          <input type="number" id="topK" value="20" min="1" max="40">
          <button class="run-btn" id="sendBtn" onclick="runQuery()">Run Query</button>
        </div>
        <div class="status-line" id="status"></div>
      </div>

      <div class="field-label" style="padding:12px 16px 4px">Source Documents</div>
      <div class="s-docs" id="docList"></div>

    </div>
  </div>

  <div class="main">
    <div class="answer-scroll">
      <div class="answer-wrap" id="answerWrap">
        <div class="empty-state">Run a query to see the answer here.</div>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay" onclick="handleModalClick(event)">
  <div class="modal-box">
    <img id="modalImg" src="" alt="">
    <div class="modal-footer">
      <span class="modal-marker" id="modalMarker"></span>
      <span class="modal-desc" id="modalDesc"></span>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
